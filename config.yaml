# Sports calendar rules. Edit this file to change what lands on the calendar.
#
# Sources:   espn_soccer (ESPN, all competitions for a club; team = ESPN club id)
#            espn        (ESPN US sports: needs sport + league; team = ESPN team id)
#            mlb         (official MLB Stats API; team = MLB team id)
#            nhl         (official NHL API; team = 3-letter abbrev)
# Windows:   ["MM-DD", "MM-DD"] resolved in the season-end year
#            (July 1 onward counts as next year's season).

output: docs/sports.ics

# A second, separate calendar for "secondary favourite" games — subscribe to it
# too and untick it in Apple Calendar so it's hidden until you want it. Rules
# with `calendar: secondary` go here; anything already on the main calendar is
# left off it, so both can be shown at once without duplicates.
secondary:
  output: docs/sports-more.ics
  name: More Sports

timezone: America/Denver        # used to read the dates in `exclude:` and `extra:`
keep_past_days: 5               # hide events that ended more than this many days ago

# Remove generated events you can't watch. Every field is optional; all given
# fields must match. Dates are inclusive. Edit this on github.com or in the
# GitHub app; the calendar rebuilds within a couple of minutes.
#   - title: Mets Dodgers                       # as shown on the calendar (suffix after " · " ignored)
#     between: [2026-09-04, 2026-09-06]
#   - between: [2026-09-01, 2026-09-14]         # a trip: drop whole sports
#     sports: [baseball, basketball]
#   - id: mlb-823649                            # copy from the last line of an event's notes
#   - rules: [Premier League big four]          # everything a rule produced
exclude:
  # Weddings in October — skip these two DU Pioneers home series.
  - title: Michigan Denver
    between: [2026-10-16, 2026-10-19]
  - title: Boston College Denver
    between: [2026-10-23, 2026-10-26]

# Your own events. A date start = all-day (end inclusive, optional).
# A datetime start = timed event (`hours` default 2).
#   - title: Ryder Cup
#     start: 2027-09-24
#     end: 2027-09-26
#   - title: Fury Usyk
#     start: 2026-12-19T21:00Z
#     hours: 3
#     notes: DAZN
extra: []

# Short names used in event titles, per sport. Left side = the source's short name.
display_names:
  soccer:
    Man United: United
    Man City: City
    Inter Milan: Inter
    Spurs: Tottenham
  hockey:
    Avalanche: Avs

